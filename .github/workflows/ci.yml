name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Rust stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  cli-smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        run: cargo build --release --locked
      - name: Pipelines + convert + query + reverse
        run: |
          ./target/release/yar2sig pipelines
          ./target/release/yar2sig convert samples/malware.yar -p sysmon | head -20
          ./target/release/yar2sig query samples/malware.yar -b splunk
          ./target/release/yar2sig convert samples/malware.yar -o /tmp/sigma
          ./target/release/yar2sig reverse /tmp/sigma -o /tmp/yara

  docker:
    name: Docker build + healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t yar2sig:ci .
      - name: Run + healthcheck
        run: |
          docker run -d --name yar2sig -p 8000:8000 yar2sig:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "::error::container did not become healthy"; docker logs yar2sig; exit 1
