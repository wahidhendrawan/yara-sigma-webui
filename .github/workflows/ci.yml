name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web,dev]"
      - name: Run tests with coverage gate
        run: pytest -q --cov=yar2sig --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true
      - name: Compile sources
        run: python -m compileall app.py yar2sig tests

  cli-smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Pipelines + convert + query
        run: |
          python -m yar2sig pipelines
          python -m yar2sig convert samples/malware.yar -p sysmon | head -20
          python -m yar2sig query samples/malware.yar -b splunk

  docker:
    name: Docker build + healthcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t yar2sig:ci .
      - name: Run + healthcheck
        run: |
          docker run -d --name yar2sig -p 8000:8000 yar2sig:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "::error::container did not become healthy"; docker logs yar2sig; exit 1
